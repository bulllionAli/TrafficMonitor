name: Release CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:

  x64_build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Install MFC and ATL
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $InstallerDir = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
        $Installer = Join-Path $InstallerDir "vs_installer.exe"
        $VsWhere = Join-Path $InstallerDir "vswhere.exe"

        if (-not (Test-Path $Installer)) {
          throw "Visual Studio Installer not found: $Installer"
        }

        if (-not (Test-Path $VsWhere)) {
          throw "vswhere.exe not found: $VsWhere"
        }

        $InstallPath = & $VsWhere -latest -products * -property installationPath

        if (-not $InstallPath) {
          throw "Could not find Visual Studio installation path."
        }

        Write-Host "Visual Studio installation path:"
        Write-Host $InstallPath

        Write-Host "Installing ATL and MFC..."

        $Arguments = @(
          "modify"
          "--installPath"
          "$InstallPath"
          "--add"
          "Microsoft.VisualStudio.Component.VC.ATL"
          "--add"
          "Microsoft.VisualStudio.Component.VC.ATLMFC"
          "--quiet"
          "--wait"
          "--norestart"
        )

        & $Installer @Arguments

        $ExitCode = $LASTEXITCODE

        Write-Host "Visual Studio Installer exit code: $ExitCode"

        if ($ExitCode -ne 0) {
          throw "Visual Studio Installer failed with exit code $ExitCode"
        }

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Run msbuild
      run: |
        msbuild TrafficMonitor_Lite.sln `
          -p:configuration="Release (lite)" `
          -p:platform=x64 `
          -p:platformToolset=v143

    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: |
          Bin/x64/Release (lite)/TrafficMonitor.exe
          Bin/x64/Release (lite)/*.dll

    - name: Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/x64/Release (lite)/*.pdb


