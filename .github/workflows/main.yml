name: Release CI
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:

  x64_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install MFC and ATL
      shell: pwsh
      run: |
        Set-Location "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\"
        $InstallPath = & ".\vswhere.exe" -latest -property installationPath
        $ComponentsToAdd = @(
          "Microsoft.VisualStudio.Component.VC.ATL",
          "Microsoft.VisualStudio.Component.VC.ATLMFC"
        )
        [string]$ComponentArgs = $ComponentsToAdd | ForEach-Object { " --add " + $_ }
        $Arguments = @('/c', 'vs_installer.exe', 'modify', '--installPath', "`"$InstallPath`"", $ComponentArgs, '--quiet', '--norestart')
        $ExitCode = 1
        for ($i = 1; $i -le 3; $i++) {
          Write-Host "vs_installer attempt $i..."
          $Process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
          $ExitCode = $Process.ExitCode
          Write-Host "Exit code: $ExitCode"
          if ($ExitCode -eq 0) { break }
          Start-Sleep -Seconds 15
        }
        if ($ExitCode -ne 0) {
          Write-Host "##[error] vs_installer failed after 3 attempts (exit code $ExitCode). Known intermittent GitHub Actions Windows-runner issue (actions/runner-images#12880) - re-running the job often resolves it."
          exit 1
        }
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
      
    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: |
          Bin/x64/Release (lite)/TrafficMonitor.exe
          Bin/x64/Release (lite)/*.dll

    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/x64/Release (lite)/*.pdb

